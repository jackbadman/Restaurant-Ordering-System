services:
  backend:
    build: ./backend
    container_name: restaurant-backend
    restart: always
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: restaurant-frontend
    restart: always
    ports:
      - "4173:4173"
    depends_on:
      - backend
